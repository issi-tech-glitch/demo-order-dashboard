# Testet jede Änderung (Pull Requests, z.B. von Renovate, und Pushes auf
# main). Nur ein grüner Stand auf main wird auf den Branch "production"
# übernommen, den der VPS automatisch einspielt.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Python-Dateien auf Syntaxfehler prüfen
        run: python3 -m py_compile app.py pages/*.py

      - name: Produktions-Image bauen
        run: docker build -t streamlit-app:ci .

      - name: Container starten und Health Check
        run: |
          docker run -d --name streamlit -p 8501:8501 \
            -e SUPABASE_URL=http://localhost/ci \
            -e SUPABASE_KEY=ci \
            streamlit-app:ci
          for i in $(seq 1 60); do
            [ "$(curl -fs http://localhost:8501/_stcore/health)" = "ok" ] && break
            sleep 1
          done
          if [ "$(curl -fs http://localhost:8501/_stcore/health)" != "ok" ]; then
            docker logs streamlit
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/)" = 200
          echo "Streamlit läuft"

  promote:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Getesteten Stand für den VPS freigeben
        run: git push origin HEAD:refs/heads/production
